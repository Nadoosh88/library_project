{% extends 'books/base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white">
                <h4 class="mb-0">Report Lost Book</h4>
            </div>
            <div class="card-body">
                <p><strong>Member:</strong> {{ loan.member.user.username }}</p>
                <p><strong>Book Title:</strong> {{ loan.book.title }}</p>
                <p><strong>Due Date:</strong> {{ loan.due_date }}</p>

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="replacement_cost" class="form-label">Replacement Fine Amount ($)</label>
                        <input type="number" step="0.01" name="replacement_cost" id="replacement_cost" class="form-control" value="50.00" required>
                    </div>

                    <button type="submit" class="btn btn-danger w-100">Confirm Book as Lost & Issue Fine</button>
                    <a href="{% url 'active_loans' %}" class="btn btn-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
